name: Runtime tests (input bring-up)
true:
  pull_request:
    branches:
    - main
    paths:
    - crates/**
    - ctest/**
    - wire/**
    - Cargo.toml
    - Cargo.lock
    - .cargo/config.toml
    - .github/workflows/runtime-tests.yml
  push:
    branches:
    - main
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: cargo test + musl cross-build + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout runtime (this PR)
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        path: runtime
    - name: Checkout platform (sibling, main)
      uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        repository: pocketforge-os/platform
        ref: main
        path: platform
    - name: Install stable Rust toolchain + aarch64-musl target
      run: 'rustup toolchain install stable --profile minimal --no-self-update --component
        clippy

        rustup default stable

        rustup target add aarch64-unknown-linux-musl

        rustc --version

        cargo --version

        cargo clippy --version

        '
    - name: Cache cargo registry + target
      uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57
      with:
        path: '~/.cargo/registry

          ~/.cargo/git

          runtime/target

          '
        key: runtime-tests-${{ runner.os }}-${{ hashFiles('runtime/Cargo.lock') }}
        restore-keys: 'runtime-tests-${{ runner.os }}-

          '
    - name: "cargo metadata \u2014 lockfile is up to date (--locked)"
      working-directory: runtime
      run: 'cargo metadata --locked --format-version 1 > /dev/null

        '
    - name: "cargo test \u2014 whole workspace (with PF_PLATFORM_DIR)"
      env:
        PF_PLATFORM_DIR: ${{ github.workspace }}/platform
      working-directory: runtime
      run: 'cargo test --locked --workspace --no-fail-fast -- --nocapture

        '
    - name: "cargo build \u2014 aarch64-unknown-linux-musl (no RUSTFLAGS)"
      working-directory: runtime
      run: "cargo build --locked --target aarch64-unknown-linux-musl \\\n  -p pf-input-collect\
        \ --bin pf-input-collect\ncargo build --locked --target aarch64-unknown-linux-musl\
        \ \\\n  -p pf-collect-ui --bin pf-collect-ui\n"
