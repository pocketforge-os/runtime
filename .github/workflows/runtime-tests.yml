# Whole-workspace runtime, real platform fixtures, locked/offline vendor,
# musl cross-linker, GNU C SDK ABI and warnings-as-errors gates. The committed
# scripts/ci-container.sh is the payload; dependencies belong to the pinned OCI
# image. github.sha retains exact synthetic-merge testing on pull requests.
name: Runtime tests (input bring-up)
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'ctest/**'
      - 'include/**'
      - 'wire/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vendor/**'
      - 'scripts/check-vendor.sh'
      - 'scripts/refresh-vendor.sh'
      - 'scripts/test-check-vendor.sh'
      - 'scripts/build-sdk.sh'
      - 'scripts/ci-container.sh'
      - '.cargo/config.toml'
      - '.github/workflows/runtime-tests.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: pocketforge-os/shared-workflows/.github/workflows/rust-container.yml@cdf8479049cfd868ae679d39628c93ff27834a4f
    with:
      source-sha: ${{ github.sha }}
      workflow-sha: cdf8479049cfd868ae679d39628c93ff27834a4f
      image: 10.0.32.86:5555/pocketforge/ci-rust@sha256:801f15f7e8fd20b449e3b0d0a7a56d632e28dae825b251a19a30e6f8b32bd8e9
      script: scripts/ci-container.sh
  # GitHub prefixes reusable job names. Keep the existing required check exact;
  # failure/cancel/skip of the REAL payload cannot make this result gate green.
  test:
    name: cargo test + musl cross-build + clippy
    needs: rust
    if: >-
      always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, pf-ci]
    timeout-minutes: 2
    steps:
      - name: Require successful container payload
        env:
          RESULT: ${{ needs.rust.result }}
        run: test "$RESULT" = success
