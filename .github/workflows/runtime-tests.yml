# Whole-workspace runtime, real platform fixtures, locked/offline vendor,
# musl cross-linker, GNU C SDK ABI and warnings-as-errors gates. The committed
# scripts/ci-container.sh is the payload; dependencies belong to the pinned OCI
# image. github.sha retains exact synthetic-merge testing on pull requests.
name: Runtime tests (input bring-up)
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/**'
      - 'ctest/**'
      - 'include/**'
      - 'systemd/**'
      - 'wire/**'
      - 'guard/**'
      - 'tests/fixtures/uinput-domain-v1.tsv'
      - 'tests/test_uinput_domain_*'
      - 'tests/test_uinput_inventory_*'
      - 'tests/uinput_inventory*'
      - 'tests/uinput-inventory.txt'
      - 'tests/fixtures/host-route-*'
      - 'tests/fixtures/input-runner-host-map-*'
      - 'docs/host-route-policy.md'
      - 'bench/input-latency/inputlat.c'
      - 'docs/uinput-execution-domain.md'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'vendor/**'
      - 'scripts/check-vendor.sh'
      - 'scripts/check-wlshm-focus-proof.py'
      - 'scripts/test-wlshm-focus-proof.sh'
      - 'scripts/build-wlshm-focus-proof-artifact.sh'
      - 'scripts/refresh-vendor.sh'
      - 'scripts/test-check-vendor.sh'
      - 'scripts/test-uinput-domain.sh'
      - 'scripts/build-sdk.sh'
      - 'scripts/ci-container.sh'
      - '.cargo/config.toml'
      - '.github/workflows/runtime-tests.yml'
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
env:
  ARTIFACT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_RUST_IMAGE: 10.0.32.86:5555/pocketforge/ci-rust@sha256:801f15f7e8fd20b449e3b0d0a7a56d632e28dae825b251a19a30e6f8b32bd8e9
concurrency:
  group: runtime-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    uses: pocketforge-os/shared-workflows/.github/workflows/rust-container.yml@4085a8e8bd02bd5e4fb87f986578b7237c089c07
    with:
      source-sha: ${{ github.sha }}
      workflow-sha: 4085a8e8bd02bd5e4fb87f986578b7237c089c07
      image: 10.0.32.86:5555/pocketforge/ci-rust@sha256:801f15f7e8fd20b449e3b0d0a7a56d632e28dae825b251a19a30e6f8b32bd8e9
      script: scripts/ci-container.sh
  # GitHub prefixes reusable job names. Keep the existing required check exact;
  # failure/cancel/skip of the REAL payload cannot make this result gate green.
  test:
    name: cargo test + musl cross-build + clippy
    needs: rust
    if: >-
      always() && (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, pf-ci]
    timeout-minutes: 2
    steps:
      - name: Require successful container payload
        env:
          RESULT: ${{ needs.rust.result }}
        run: test "$RESULT" = success
  wlshm-proof-artifact:
    name: AArch64 wl_shm focus proof artifact
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, pf-builder-vm]
    timeout-minutes: 15
    steps:
      - name: Repair workspace ownership before checkout
        run: |
          if sudo -n true; then
            sudo -n chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"
          fi
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ env.ARTIFACT_SOURCE_SHA }}
          persist-credentials: false
      - name: Build exact source in pinned OCI image
        env:
          PF_SOURCE_SHA: ${{ env.ARTIFACT_SOURCE_SHA }}
          PF_IMAGE: ${{ env.CI_RUST_IMAGE }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$PF_SOURCE_SHA"
          source_date_epoch=$(git show -s --format=%ct "$PF_SOURCE_SHA")
          podman pull --tls-verify=false \
            10.0.32.86:5555/pocketforge/ci-rust@sha256:801f15f7e8fd20b449e3b0d0a7a56d632e28dae825b251a19a30e6f8b32bd8e9
          podman run --rm --pull=never --userns=keep-id --network=none \
            -v "$GITHUB_WORKSPACE:/work:Z" -w /work -- \
            10.0.32.86:5555/pocketforge/ci-rust@sha256:801f15f7e8fd20b449e3b0d0a7a56d632e28dae825b251a19a30e6f8b32bd8e9 \
            env PF_SOURCE_SHA="$PF_SOURCE_SHA" PF_IMAGE="$PF_IMAGE" \
            SOURCE_DATE_EPOCH="$source_date_epoch" \
            bash scripts/build-wlshm-focus-proof-artifact.sh
      - name: Upload exact binary, hashes and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wlshm-focus-proof-${{ env.ARTIFACT_SOURCE_SHA }}
          path: .ci-artifacts/wlshm-focus-proof/
          if-no-files-found: error
