[package]
name = "pf-render-text-spike"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace]

[dependencies]
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }
tiny-skia = { version = "0.11", features = ["png-format"] }

[profile.release]
codegen-units = 1
lto = "thin"
