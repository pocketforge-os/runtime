[package]
name = "pf-input-broker"
description = "The v0 INPUT broker daemon (tsp-e1b.6): EVIOCGRABs the real evdev device, applies the descriptor action-map remap + rate limit, and re-emits via a uinput VIRTUAL device the app reads. The ONE capability with REAL v0 enforcement on the vendor 4.9 kernel (no namespaces). Hands the app the shared read fd via SCM_RIGHTS (the wire's Acquire(input) path)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "pf_input_broker"
path = "src/lib.rs"

[[bin]]
name = "pf-input-broker"
path = "src/bin/pf-input-broker.rs"

[[bin]]
name = "pf-input-read"
path = "src/bin/pf-input-read.rs"

[dependencies]
pocketforge = { workspace = true }
pf-wire = { workspace = true }
libc = { workspace = true }
# Reads the session authority's JSON reply to the SafeReturn frame (--safe-return-sock).
serde_json = { workspace = true }

[dev-dependencies]
# Hermetic proof that the broker's SafeReturn frame drives the REAL authority RPC path
# (tests/safe_return_authority.rs) and that GetAppearance reaches a real prefsd
# (tests/prefsd_passthrough.rs). Test-only: the daemon links none of these.
pf-session-authority = { workspace = true }
pf-app-manifest = { workspace = true }
pf-ports = { workspace = true }
pf-prefs = { workspace = true }
pf-prefsd = { workspace = true }
