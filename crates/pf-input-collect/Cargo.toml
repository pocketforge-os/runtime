[package]
name = "pf-input-collect"
description = "Guided-collection ENGINE (tsp-bwrg.2): the headless data heart of the input bring-up app. With NO pre-filled descriptor it prompts for each control in turn, reads the RAW /dev/input/eventN node directly (post-decoder, exactly as platform/regression/caps/evdev-probe.py --watch does — it CANNOT go through pf-input-broker, whose InputBroker::start_with() requires a Descriptor this mode has none of), records the raw evdev event(s) per prompt, classifies binary-vs-analog triggers from observed behavior, and emits a candidate capabilities.toml the on-panel UI (tsp-bwrg.3) drives. Validated headless against a synthetic a133-shaped event stream."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "pf_input_collect"
path = "src/lib.rs"

[[bin]]
name = "pf-input-collect"
path = "src/bin/pf-input-collect.rs"

[dependencies]
# libc: the raw evdev ioctls (EVIOCGNAME/EVIOCGID/EVIOCGABS), input_event / input_id /
# input_absinfo struct layouts, and poll(2)/read(2) for the blocking read path. The ioctl table
# is carried self-contained (typed as libc::Ioctl, the pf-hw-exerciser precedent) rather than
# reused from pf-input-broker, so this device binary cross-compiles cleanly to
# aarch64-unknown-linux-musl (static) AND stays decoupled from in-flight pf-input-broker edits.
# Same "one place raw syscalls are unavoidable" rationale as pf-input-broker / pf-hw-exerciser.
libc = { workspace = true }

[dev-dependencies]
# TESTS ONLY — the FRAME vocabulary, consumed rather than re-derived (tsp-ozbp.14 / runtime#33).
# `pf_input_decode::codes` is where the two evdev code frames are DEFINED (Frame D = driver-emitted,
# what a `capabilities.toml` `code` records; Frame C = kernel-canonical POSITIONAL, what this
# decoder emits and what the broker re-emits), and it exports the positional constants
# `BTN_SOUTH`/`BTN_EAST`/`BTN_WEST`/`BTN_NORTH`. Test fixtures here anchor on THOSE constants so a
# button is named by its physical position, never by a printed glyph and never by a bare number
# whose frame is unstated. Writing a second local `const BTN_… = 0x13…` table would be a second
# independent derivation — i.e. a second chance to invert it, which is the exact bug tsp-ozbp.14
# fixed. This is a dev-dependency: the shipped engine binary does not link the decoder.
pf-input-decode = { path = "../pf-input-decode", version = "0.0.1" }
