[package]
name = "pf-render"
description = "Deterministic CPU rasterizer for PocketForge semantic scenes"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cosmic-text = { version = "0.12", default-features = false, features = ["std", "swash"] }
cosmic-text-tracking = { package = "cosmic-text", version = "0.15", default-features = false, features = ["std", "swash"] }
pf-scene = { workspace = true }
pf-theme = { workspace = true }
png = "0.17"
tiny-skia = "0.11"
serde_json = "1"
