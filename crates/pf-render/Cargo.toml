[package]
name = "pf-render"
description = "Deterministic CPU rasterizer for PocketForge semantic scenes"
version.workspace = true
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
pf-scene = { workspace = true }
pf-theme = { workspace = true }
pf-text-raster = { workspace = true, features = ["default-fonts"] }
png = "0.17"
tiny-skia = "0.12"
serde_json = "1"

[build-dependencies]
serde_json = "1"

[dev-dependencies]
cosmic-text-tracking = { package = "cosmic-text", version = "0.15", default-features = false, features = ["std", "swash"] }
