[workspace]
resolver = "2"
members = [
    "crates/pf-uinput-domain",
    "crates/pf-wire",
    "crates/pocketforge",
    "crates/libpocketforge",
    "crates/pf-broker-ref",
    "crates/pf-input-broker",
    "crates/pf-broker",
    "crates/pf-hw-exerciser",
    "crates/pf-prefs",
    "crates/pf-prefsd",
    "crates/pf-powerd",
    "crates/pf-peer-identity",
    "crates/pf-prefs-port",
    "crates/pf-settings",
    "crates/pf-input-collect",
    "crates/pf-input-decode",
    "crates/pf-collect-ui",
    "crates/pf-scene",
    "crates/pf-ports",
    "crates/pf-theme",
    "crates/pf-input-map",
    "crates/pf-render",
    "crates/pf-text-raster",
    "crates/pf-ui-test-contracts",
    "crates/pf-framehost",
    "crates/pf-framehost-wayland",
    "crates/pf-app-manifest",
    "crates/pf-app-launch",
    "crates/pf-session-authority",
    "crates/pf-session-client",
    "crates/pf-session-contract",
    "crates/pf-problem-report",
    "crates/pf-hang-trigger",
    "crates/pf-hang-sampler",
    "crates/pf-input-ipc",
    "crates/pf-menu",
    "crates/pf-menu-scene",
    "crates/pf-volumed",
    "crates/pf-volume-keys",
]

# Shared metadata for every crate in the runtime workspace (tsp-e1b.2 / E2).
[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pocketforge-os/runtime"
authors = ["PocketForge <noreply@pocketforge.os>"]

[workspace.dependencies]
pf-wire = { path = "crates/pf-wire", version = "0.0.1" }
pf-uinput-domain = { path = "crates/pf-uinput-domain", version = "0.0.1" }
pocketforge = { path = "crates/pocketforge", version = "0.0.1" }
# E4 preference data layer (tsp-xubv.1) — a NEW leaf crate + its CLI.
pf-prefs = { path = "crates/pf-prefs", version = "0.0.1" }
pf-prefsd = { path = "crates/pf-prefsd", version = "0.0.1" }
# Shared kernel-attested peer identity (tsp-ght0z): pf-prefsd and the session authority use it.
pf-peer-identity = { path = "crates/pf-peer-identity", version = "0.0.1" }
pf-ports = { path = "crates/pf-ports", version = "0.0.1" }
pf-scene = { path = "crates/pf-scene", version = "0.0.1" }
pf-menu = { path = "crates/pf-menu", version = "0.0.1" }
pf-menu-scene = { path = "crates/pf-menu-scene", version = "0.0.1" }
pf-input-map = { path = "crates/pf-input-map", version = "0.0.1" }
pf-render = { path = "crates/pf-render", version = "0.0.1" }
pf-text-raster = { path = "crates/pf-text-raster", version = "0.0.1" }
pf-ui-test-contracts = { path = "crates/pf-ui-test-contracts", version = "0.0.1" }
pf-theme = { path = "crates/pf-theme", version = "0.0.1" }
pf-framehost-wayland = { path = "crates/pf-framehost-wayland", version = "0.0.1" }
pf-app-manifest = { path = "crates/pf-app-manifest", version = "0.0.1" }
pf-session-authority = { path = "crates/pf-session-authority", version = "0.0.1" }
pf-session-contract = { path = "crates/pf-session-contract", version = "0.0.1" }
pf-problem-report = { path = "crates/pf-problem-report", version = "0.0.1" }
pf-hang-trigger = { path = "crates/pf-hang-trigger", version = "0.0.1" }
pf-hang-sampler = { path = "crates/pf-hang-sampler", version = "0.0.1" }
pf-input-ipc = { path = "crates/pf-input-ipc", version = "0.0.1" }
pf-volumed = { path = "crates/pf-volumed", version = "0.0.1" }
pf-volume-keys = { path = "crates/pf-volume-keys", version = "0.0.1" }
serde = { version = "1", features = ["derive"] }
# serde_json backs the single current-state JSON preference document (owner ruling Q2). Only the
# NEW pf-prefs leaf crate depends on it; the dependency-light wire/facade crates are untouched.
serde_json = "1"
sha2 = "0.10"
toml = "0.8"
# libc: ONLY the pf-input-broker and pf-volumed daemons link it — OS-facing code (evdev/uinput
# ioctls, SCM_RIGHTS). The wire/facade crates stay dependency-light; this is the one place
# raw syscalls are unavoidable, and libc gives the correct struct layouts + ioctl FFI.
libc = "0.2"
framehop = { version = "=0.15.0", default-features = false, features = ["std"] }
object = { version = "=0.37.3", default-features = false, features = ["read_core", "elf", "std"] }
linux-raw-sys = { version = "0.12", features = ["landlock"] }
taffy = { version = "0.7.7", default-features = false, features = ["std", "taffy_tree", "flexbox", "grid", "content_size"] }

# A release profile that prefers determinism + small daemons (E2 ships privileged
# broker code; the ABI/wire are the contract, not the binary size, but keep it lean).
[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
panic = "abort"
incremental = false
