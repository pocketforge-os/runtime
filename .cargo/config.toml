# Cargo build config for the runtime workspace (tsp-bwrg.8).
#
# Pin the linker for `aarch64-unknown-linux-musl` (the a133 static-binary
# target used by pf-input-collect + pf-collect-ui + the device bench tools).
# Without this, `cargo build --target aarch64-unknown-linux-musl` on a host
# whose default `cc` cannot emit aarch64 objects fails at link with:
#   /usr/bin/ld: crt1.o: Relocations in generic ELF (EM: 183)
#   /usr/bin/ld: crt1.o: error adding symbols: file in wrong format
# rust-lld ships with every rustup toolchain, so this needs no additional
# host packages (no bootlin cross-gcc install), works on modelmaker AND on
# a stock GitHub runner. Pass-through `-C linker-flavor=ld.lld` keeps rustc
# from re-invoking `cc` as the driver.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"

# ring (rustls' crypto provider, pf-app-fetch only) compiles C and assembly through cc-rs,
# which would otherwise look for a nonexistent `aarch64-linux-musl-gcc`. The objects are
# freestanding (no libc headers), so the distro GNU cross-gcc is enough; rust-lld still links
# the static musl binary. ci-rust ships `aarch64-linux-gnu-gcc`. The image's runtime stage
# has only the Arm toolchain and overrides these with `aarch64-none-linux-gnu-*` in its
# environment (a real environment variable wins over [env] without `force`).
[env]
CC_aarch64_unknown_linux_musl = "aarch64-linux-gnu-gcc"
AR_aarch64_unknown_linux_musl = "aarch64-linux-gnu-ar"

[target.aarch64-unknown-linux-gnu]
linker = "aarch64-none-linux-gnu-gcc"
ar = "aarch64-none-linux-gnu-ar"

[source.crates-io]
replace-with = "vendored-sources"

[source.vendored-sources]
directory = "vendor"

[net]
offline = true
